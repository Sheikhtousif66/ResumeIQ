<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Job — ResumeIQ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper: #FAFAF9;
            --card: #FFFFFF;
            --ink: #14171F;
            --muted: #676B76;
            --line: #E4E4E7;
            --primary: #2F3A8F;
            --primary-dark: #232C6E;
            --accent: #0EA894;
            --accent-soft: #E3F6F2;
            --radius: 14px;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        body {
            background: var(--paper);
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 42px 42px;
            background-position: -1px -1px;
            color: var(--ink);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topnav {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 26px;
            background: rgba(250, 250, 249, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
            flex-wrap: wrap;
        }

        .topnav-brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 15.5px;
            color: var(--ink);
            letter-spacing: -0.01em;
        }

        .topnav-brand-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .topnav-links {
            display: flex;
            align-items: center;
            gap: 3px;
            flex-wrap: wrap;
        }

        .topnav-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 13.5px;
            color: var(--muted);
            padding: 7px 13px;
            border-radius: 7px;
            transition: color 0.15s ease, background 0.15s ease;
        }

        .topnav-link:hover {
            color: var(--ink);
            background: rgba(20, 23, 31, 0.05);
        }

        .topnav-link.active {
            color: var(--primary);
            background: var(--accent-soft);
            font-weight: 600;
        }

        .topnav-cta {
            background: var(--primary);
            color: #fff !important;
            font-weight: 600;
            margin-left: 4px;
        }
        .topnav-cta:hover { background: var(--primary-dark); }

        .stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        @media (max-width: 560px) {
            .topnav { padding: 12px 16px; justify-content: center; }
            .topnav-brand { display: none; }
            .topnav-links { justify-content: center; width: 100%; }
        }

        .wrap {
            width: 100%;
            max-width: 560px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--muted);
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 20px;
            transition: color 0.15s ease;
        }

        .back:hover { color: var(--ink); }

        .back svg { width: 14px; height: 14px; }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 14px;
        }

        .eyebrow::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(28px, 4.5vw, 36px);
            line-height: 1.08;
            letter-spacing: -0.02em;
            margin: 0 0 8px;
        }

        .sub {
            color: var(--muted);
            font-size: 14.5px;
            margin: 0 0 28px;
        }

        form {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: 0 1px 2px rgba(20, 23, 31, 0.04), 0 12px 32px -20px rgba(20, 23, 31, 0.25);
        }

        .field {
            margin-bottom: 20px;
        }

        .field:last-of-type {
            margin-bottom: 0;
        }

        .field-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        label {
            font-size: 13.5px;
            font-weight: 600;
        }

        .optional {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }

        input[type="text"],
        textarea {
            width: 100%;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 12px 14px;
            font-family: 'Inter', sans-serif;
            font-size: 14.5px;
            color: var(--ink);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #A6A9B2;
        }

        input[type="text"]:hover,
        textarea:hover {
            border-color: #C7C9D1;
        }

        input[type="text"]:focus-visible,
        textarea:focus-visible {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(47, 58, 143, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 130px;
            line-height: 1.55;
            font-family: 'Inter', sans-serif;
        }

        .hint {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px;
        }

        button {
            width: 100%;
            margin-top: 26px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 9px;
            padding: 13px 18px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        button:hover { background: var(--primary-dark); }
        button:active { transform: scale(0.99); }

        button:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        button svg { width: 15px; height: 15px; }

        .site-footer {
            border-top: 1px solid var(--line);
            padding: 18px 26px;
        }

        .footer-inner {
            max-width: 560px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
        }

        .footer-brand {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 12.5px;
            color: var(--muted);
        }

        .footer-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.7;
        }

        .footer-stack {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.04em;
            color: var(--muted);
        }
    </style>
</head>

<body>

    <nav class="topnav">
        <a href="/" class="topnav-brand"><span class="topnav-brand-dot"></span>ResumeIQ</a>
        <div class="topnav-links">
            <a href="/" class="topnav-link">Upload</a>
            <a href="/jobs" class="topnav-link active">Jobs</a>
            <a href="/candidates" class="topnav-link">Candidates</a>
        </div>
    </nav>

    <div class="stage">
    <div class="wrap">

        <a href="/jobs" class="back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Back to jobs
        </a>

        <div class="eyebrow">New role</div>
        <h1>Create job</h1>
        <p class="sub">This is what incoming résumés will be scored against.</p>

        <form action="/jobs/create" method="POST">

            <div class="field">
                <div class="field-head">
                    <label for="title">Job title</label>
                </div>
                <input type="text" id="title" name="title" placeholder="e.g. QA Automation Engineer" required>
            </div>

            <div class="field">
                <div class="field-head">
                    <label for="skills">Required skills</label>
                </div>
                <input type="text" id="skills" name="skills" placeholder="Python, Flask, SQL" required>
                <div class="hint">Comma-separated — this drives the match score.</div>
            </div>

            <div class="field">
                <div class="field-head">
                    <label for="experience">Experience</label>
                    <span class="optional">Optional</span>
                </div>
                <input type="text" id="experience" name="experience" placeholder="2 years">
            </div>

            <div class="field">
                <div class="field-head">
                    <label for="education">Education</label>
                    <span class="optional">Optional</span>
                </div>
                <input type="text" id="education" name="education" placeholder="BCA / MCA">
            </div>

            <div class="field">
                <div class="field-head">
                    <label for="description">Job description</label>
                    <span class="optional">Optional</span>
                </div>
                <textarea id="description" name="description" rows="8"></textarea>
            </div>

            <button type="submit">
                Save job
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </button>
        </form>

    </div>
    </div>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand"><span class="footer-dot"></span>ResumeIQ</div>
            <div class="footer-stack">ResumeIQ • Flask • SQLite • AI-powered matching</div>
        </div>
    </footer>

</body>

</html>
